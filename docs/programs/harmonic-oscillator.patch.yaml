format: anasim-patch 1
patch:
  id: harmonic_oscillator
  version: 0.1.0
  title: Harmonic oscillator
  description: Two integrators and an inverter in a loop (MRD section 9.10), dv/dt = -omega^2 x, dx/dt = v.
  model: {id: harmonic-oscillator, version: 1.0.0}
machine: {time_scale: auto}
elements:
  - {id: I_v, kind: integrator, represents: v, max: 2.5, ic: v_0, inputs: [{from: I_x, weight: "omega^2"}], position: [0, 0]}
  - {id: N_v, kind: inverter, represents: -v, inputs: [{from: I_v}], position: [1, 0]}
  - {id: I_x, kind: integrator, represents: x, max: 1.25, ic: x_0, inputs: [{from: N_v, weight: 1}], position: [2, 0]}
outputs:
  - {name: x, element: I_x}
  - {name: v, element: I_v}
