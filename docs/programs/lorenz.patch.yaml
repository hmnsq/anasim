format: anasim-patch 1
patch:
  id: lorenz
  version: 0.1.0
  title: Lorenz system
  description: >-
    x' = sigma (y - x), y' = rho x - x z - y, z' = x y - beta z with three integrators, two inverters and two
    multipliers. Bounds 25, 35 and 60 for x, y and z leave headroom over the peaks 19.6, 27.2 and 47.8 (t <= 50).
  model: {id: lorenz, version: 1.0.0}
machine: {time_scale: auto}
elements:
  - {id: I_x, kind: integrator, represents: x, max: 25, ic: x_0, inputs: [{from: I_x, weight: sigma}, {from: N_y, weight: sigma}], position: [0, 0]}
  - {id: N_x, kind: inverter, represents: -x, inputs: [{from: I_x}], position: [1, 0]}
  - {id: I_y, kind: integrator, represents: y, max: 35, ic: y_0, inputs: [{from: N_x, weight: rho}, {from: P_xz, weight: 1}, {from: I_y, weight: 1}], position: [0, 1]}
  - {id: N_y, kind: inverter, represents: -y, inputs: [{from: I_y}], position: [1, 1]}
  - {id: I_z, kind: integrator, represents: z, max: 60, ic: z_0, inputs: [{from: P_nxy, weight: 1}, {from: I_z, weight: beta}], position: [0, 2]}
  - {id: P_xz, kind: multiplier, represents: x*z, max: 1500, inputs: [{from: I_x}, {from: I_z}], position: [2, 1]}
  - {id: P_nxy, kind: multiplier, represents: -x*y, max: 875, inputs: [{from: N_x}, {from: I_y}], position: [2, 2]}
outputs:
  - {name: x, element: I_x}
  - {name: y, element: I_y}
  - {name: z, element: I_z}
