format: anasim-patch 1
patch:
  id: defect_unconnected_empty
  version: 0.1.0
  title: "Planted defect: UNCONNECTED"
  description: An inverter with its input list empty.
  model: {id: harmonic-oscillator, version: 1.0.0}
  planted_defect: UNCONNECTED
elements:
  - {id: I_v, kind: integrator, represents: v, max: 2.5, ic: v_0, inputs: [{from: I_x, weight: "omega^2"}]}
  - {id: N_v, kind: inverter, represents: -v, inputs: []}
  - {id: I_x, kind: integrator, represents: x, max: 1.25, ic: x_0, inputs: [{from: N_v, weight: 1}]}
outputs:
  - {name: x, element: I_x}
